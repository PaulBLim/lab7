info:
  name: Outdoor plants
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/plants?indoor=false"
  params:
    - name: indoor
      value: "false"
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "**Bonus 5**: filter with a query parameter."
