info:
  name: Plants with a tag
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/plants?tag=succulent"
  params:
    - name: tag
      value: succulent
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "**Bonus 5**: only plants that have the tag `succulent`."
