info:
  name: Plants that need water today
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/plants?due_within_days=0"
  params:
    - name: due_within_days
      value: "0"
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: '**Bonus 5**: plants that are due today or overdue. The Aloe from "Add an outdoor plant" should be in the list.'
