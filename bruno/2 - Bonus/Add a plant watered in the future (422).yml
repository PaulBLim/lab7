info:
  name: Add a plant watered in the future (422)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/plants"
  body:
    type: json
    data: |-
      {
        "name": "Basil",
        "last_watered": "2099-01-01"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "**Bonus 1**: `last_watered cannot be in the future`."
