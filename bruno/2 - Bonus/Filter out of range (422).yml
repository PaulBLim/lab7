info:
  name: Filter out of range (422)
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/plants?due_within_days=99"
  params:
    - name: due_within_days
      value: "99"
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "**Bonus 5**: `Query(ge=0, le=60)` makes FastAPI reject values outside 0-60."
