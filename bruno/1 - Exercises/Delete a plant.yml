info:
  name: Delete a plant
  type: http
  seq: 9

http:
  method: DELETE
  url: "{{baseUrl}}/plants/{{plantId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "**Exercise 6**: `DELETE` answers `204 No Content` with an empty body."
