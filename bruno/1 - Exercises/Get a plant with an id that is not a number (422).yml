info:
  name: Get a plant with an id that is not a number (422)
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/plants/abc"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "**Exercise 3**: `plant_id: int` in the path means FastAPI validates it for you."
