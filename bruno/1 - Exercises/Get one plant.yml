info:
  name: Get one plant
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/plants/{{plantId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: '**Exercise 3**: `GET /plants/{id}` returns one plant. Run "Add a plant" first so `{{plantId}}` is set.'
