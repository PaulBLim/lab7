info:
  name: Get a plant that does not exist (404)
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/plants/9999"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: '**Exercise 3**: an unknown id answers `404` with `{"detail": "Plant not found"}`.'
