info:
  name: List all plants
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/plants"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "**Example 2**: `GET /plants` returns every plant as a JSON list, `200 OK`."
