info:
  name: Delete the same plant again (404)
  type: http
  seq: 10

http:
  method: DELETE
  url: "{{baseUrl}}/plants/{{plantId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "**Exercise 6**: the plant is gone now, so deleting it again is a `404`."
